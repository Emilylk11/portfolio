<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Experimentation and measurement">
  <defs>
    <linearGradient id="eg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#dfe9fd"/>
    </linearGradient>
    <pattern id="edot" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.4" fill="#c5c9d1" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#eg)"/>
  <rect width="800" height="500" fill="url(#edot)"/>

  <text x="400" y="66" font-family="DM Sans,Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#1a1a2e" text-anchor="middle" letter-spacing="-0.5">Experimentation &amp; Measurement</text>
  <text x="400" y="94" font-family="DM Sans,Segoe UI,sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" letter-spacing="1.4">CONTROL vs VARIANT · REVENUE-READ</text>

  <!-- Control -->
  <rect x="96" y="140" width="252" height="230" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="222" y="170" font-family="DM Sans,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1.6">CONTROL</text>
  <rect x="128" y="188" width="188" height="52" rx="8" fill="#eef1f6"/>
  <rect x="128" y="252" width="140" height="9" rx="4.5" fill="#e5e9f0"/>
  <rect x="128" y="268" width="112" height="9" rx="4.5" fill="#eef1f6"/>
  <rect x="128" y="300" width="88" height="28" rx="14" fill="#cbd5e1"/>

  <!-- Variant -->
  <rect x="452" y="140" width="252" height="230" rx="16" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="578" y="170" font-family="DM Sans,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.6">VARIANT</text>
  <rect x="484" y="188" width="188" height="52" rx="8" fill="#dbeafe"/>
  <rect x="484" y="252" width="140" height="9" rx="4.5" fill="#c7d7fb"/>
  <rect x="484" y="268" width="112" height="9" rx="4.5" fill="#dbeafe"/>
  <rect x="484" y="296" width="112" height="32" rx="16" fill="#2563eb"/>
  <circle cx="672" cy="196" r="15" fill="#2563eb"/>
  <path d="M665 196 l5 5 l9 -10" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- divider -->
  <path d="M400 150 V360" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 7" opacity=".4"/>
  <circle cx="400" cy="255" r="26" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="262" font-family="DM Sans,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">A/B</text>

  <!-- uplift -->
  <path d="M120 434 L200 418 L280 424 L360 402 L440 408 L520 384 L600 390 L680 362" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="680" cy="362" r="6" fill="#2563eb"/>
  <text x="400" y="470" font-family="DM Sans,Segoe UI,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">revenue per variant, read through cross-domain attribution</text>
</svg>
